apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: pulsegraph
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: pulsegraph/api:dev
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: pulsegraph-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pulsegraph-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: pulsegraph
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: pulsegraph
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
