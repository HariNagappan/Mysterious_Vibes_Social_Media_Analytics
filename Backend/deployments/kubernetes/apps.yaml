            - configMapRef:
                name: pulsegraph-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: pulsegraph
spec:
  replicas: 1
  selector:
